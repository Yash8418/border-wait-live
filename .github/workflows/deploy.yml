name: Deploy

# Deploys to AWS after CI passes on main. Uses GitHub's OIDC token to assume an IAM role,
# so no long-lived AWS keys are stored in the repository. See docs/aws-setup.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # needed to request the OIDC token
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skip until the AWS role is configured, and only deploy commits that passed CI.
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ca-central-1' }}

      - name: Build
        run: sam build

      - name: Deploy
        run: |
          sam deploy --parameter-overrides "AlertEmail=${{ vars.ALERT_EMAIL }}"

      - name: Show API URL
        run: |
          url=$(aws cloudformation describe-stacks --stack-name border-wait-live \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "API: ${url}crossings" >> "$GITHUB_STEP_SUMMARY"
