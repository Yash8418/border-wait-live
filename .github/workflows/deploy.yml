name: Deploy

# Deploys to AWS after CI passes on main. Uses GitHub's OIDC token to assume an IAM role,
# so no long-lived AWS keys are stored in the repository. See docs/aws-setup.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # needed to request the OIDC token
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skip until the AWS role is configured, and only deploy commits that passed CI.
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ca-central-1' }}

      - name: Build
        run: sam build

      - name: Deploy
        run: |
          sam deploy --parameter-overrides "AlertEmail=${{ vars.ALERT_EMAIL }}"

      - name: Read stack outputs
        id: stack
        run: |
          output() {
            aws cloudformation describe-stacks --stack-name border-wait-live \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "api_url=$(output ApiUrl)" >> "$GITHUB_OUTPUT"
          echo "collector=$(output CollectorFunctionName)" >> "$GITHUB_OUTPUT"

      - name: Run the collector once
        # So the API has data straight away instead of after the first scheduled run.
        run: |
          aws lambda invoke --function-name "${{ steps.stack.outputs.collector }}" \
            --cli-read-timeout 90 --log-type Tail --query FunctionError --output text result.json > error.txt
          cat result.json; echo
          if [ "$(cat error.txt)" != "None" ]; then echo "::error::Collector failed: $(cat result.json)"; exit 1; fi

      - name: Smoke test the public API
        env:
          API_URL: ${{ steps.stack.outputs.api_url }}
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 5 "${API_URL}crossings")
          count=$(echo "$body" | jq '.count')
          echo "$body" | jq -e '.crossings | map(.crossing_id) | index("ambassador-bridge") != null' > /dev/null \
            || { echo "::error::Ambassador Bridge missing from /crossings"; exit 1; }
          curl -fsS "${API_URL}crossings/ambassador-bridge/history" | jq -e 'has("readings")' > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' "${API_URL}crossings/not-a-real-crossing")
          [ "$code" = 404 ] || { echo "::error::Expected 404 for an unknown crossing, got $code"; exit 1; }
          {
            echo "### Deployed"
            echo "- API: ${API_URL}crossings ($count crossings)"
            echo "- Status page: open \`site/index.html\` with \`?api=${API_URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"
